schema_version: "1.1"
name: results-headings-review
expected_outcome: |
  A Chinese response that reviews the three Results headings without rewriting the body
  text. It explains that the headings are long because each joins two or more claims and
  that they use verbs that state no finding (反映、捕获、定义、关联、揭示), rather than only
  shortening them. It notes that "土壤时空状态" overstates the evidence (two soil types
  and one field's time series). It notes that the second heading opens with a definition
  ("定义") and ends in a list of weak associations (r ≈ 0.1), while the section's own
  conclusion (root plasticity is not a proxy for range breadth) is missing from it, and
  that the third heading holds two stories and credits "田间根系数据" although the
  section compares RootNet only against other models, with no version trained without
  root data. For each heading it gives a shorter replacement with a single claim and a
  concrete verb, checks the replacements against the two questions stated in the prompt,
  flags the inconsistent use of 根系形态 and 根系构型, and does not invent numbers or
  results.
